name: Package Al Azhar Center apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alazharcenterstore.vercel.app' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows 32-bit
            runner: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux DEB and RPM
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libwebkit2gtk-4.1-dev
      - name: Require a public API endpoint
        shell: bash
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable to the public HTTPS API origin."
            exit 1
          fi
      - run: npm ci
      - name: Build desktop installer
        run: npm run build:desktop -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alazharcenterstore.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Require a public API endpoint
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable to the public HTTPS API origin."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx capacitor-assets generate --android --assetPath public --iconBackgroundColor "#1f5d3a" --splashBackgroundColor "#ffffff"
      - run: npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          release_url="${api}/releases/tags/${tag}"
          if ! curl -fsS "${auth[@]}" "$release_url" > release.json; then
            curl -fsS "${auth[@]}" -X POST "${api}/releases" \
              -d "$(jq -n --arg tag "$tag" --arg name "Al Azhar Center $tag" '{tag_name:$tag,name:$name,draft:false,prerelease:false,generate_release_notes:true}')" > release.json
          fi
          upload_url="$(jq -r '.upload_url' release.json | sed 's/{?name,label}//')"
          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            printf 'Uploading %s\n' "$name"
            curl -fsS "${auth[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" "${upload_url}?name=${name}"
          done
